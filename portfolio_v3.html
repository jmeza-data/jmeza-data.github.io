/* ════════ RESET & TOKENS ════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth;font-size:16px}

::selection{background:var(--signal);color:var(--paper)}

.skip-link:focus{top:0}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:3px}

/* progress */
#bar{position:fixed;top:0;left:0;height:2px;z-index:300;background:var(--signal);width:0;transition:width .1s linear;pointer-events:none}

/* ════════ NAV ════════ */
.nav{

  border-bottom:1px solid transparent;transition:border-color .3s,background .3s;
}
.nav.scrolled{border-bottom-color:var(--rule)}
.brand{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;letter-spacing:-0.01em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px}
.brand .mark{width:9px;height:9px;border:1.5px solid var(--signal);border-radius:50%;position:relative;flex-shrink:0}
.brand .mark::after{content:'';position:absolute;inset:2px;background:var(--signal);border-radius:50%;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.nav-links{display:flex;align-items:center;gap:26px;list-style:none}
.nav-links a{font-size:14px;color:var(--dim);text-decoration:none;transition:color .2s;position:relative}
.nav-links a::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:1px;background:var(--ink);transition:width .25s var(--ease)}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after{width:100%}
.lang{display:flex;gap:2px;background:var(--paper2);border:1px solid var(--rule2);border-radius:6px;padding:3px}
.lang button{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;padding:4px 11px;border-radius:4px;border:none;cursor:pointer;background:transparent;color:var(--dim);transition:background .2s,color .2s;line-height:1}
.lang button.active{background:var(--ink);color:var(--paper)}
.lang button:hover:not(.active){color:var(--ink)}

/* ════════ HERO ════════ */
#hero{min-height:100vh;display:flex;align-items:center;padding:110px var(--gutter) 72px}

.loaded .sub{animation:rise .75s .63s var(--ease) forwards}
.loaded .ctas{animation:rise .75s .71s var(--ease) forwards}
.loaded .panel{animation:rise .85s .5s var(--ease2) forwards}
@keyframes unmask{to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}

/* ════════ LAYOUT ════════ */
.container{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.section{padding:var(--pad) 0}
.sep{height:1px;background:var(--rule)}
.alt{background:var(--paper2)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--signal);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:18px;height:1px;background:var(--signal)}
.sec-title{font-family:'Fraunces',serif;font-size:clamp(30px,3.8vw,46px);font-weight:500;letter-spacing:-0.025em;line-height:1.05;color:var(--ink);margin-bottom:14px}
.sec-sub{font-size:16px;font-weight:300;color:var(--dim);max-width:52ch;line-height:1.7;margin-bottom:52px}

/* ════════ PROJECTS ════════ */
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.proj-grid+.proj-grid{margin-top:16px}
.proj{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:0;cursor:pointer;transition:transform .3s var(--ease2),border-color .3s,box-shadow .3s;display:flex;flex-direction:column;overflow:hidden;position:relative}
.proj:hover{transform:translateY(-5px);border-color:var(--rule2);box-shadow:0 18px 44px rgba(21,25,30,0.09)}
.proj:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.proj.feat{grid-column:1/-1;flex-direction:row;align-items:stretch;background:var(--ink);border-color:var(--ink)}
.proj.feat:hover{box-shadow:0 22px 54px rgba(21,25,30,0.22)}
.proj-visual{overflow:hidden;background:var(--paper2);position:relative}
.proj-visual img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease2)}
.proj:hover .proj-visual img{transform:scale(1.04)}
.proj:not(.feat) .proj-visual{height:150px;border-bottom:1px solid var(--rule)}
.proj.feat .proj-visual{width:46%;min-height:260px;border-bottom:none;border-right:1px solid rgba(255,255,255,0.08)}
.proj-body{padding:26px 28px;flex:1;display:flex;flex-direction:column;min-width:0}
.proj.feat .proj-body{justify-content:center;padding:40px}
.tagline{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.04em;color:var(--subtle);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.proj.feat .tagline{color:rgba(255,255,255,0.5)}
.tagline .fdot{width:5px;height:5px;border-radius:50%;background:var(--signal)}
.metric{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--data);background:rgba(180,83,31,0.08);border:1px solid rgba(180,83,31,0.2);padding:3px 9px;border-radius:5px;margin-bottom:12px;width:fit-content}
.proj.feat .metric{color:#f0a877;background:rgba(240,168,119,0.1);border-color:rgba(240,168,119,0.25)}
.proj-title{font-family:'Fraunces',serif;font-size:19px;font-weight:500;letter-spacing:-0.015em;color:var(--ink);margin-bottom:9px;line-height:1.2}
.proj.feat .proj-title{color:#fff;font-size:24px}
.proj-desc{font-size:13.5px;font-weight:300;color:var(--dim);line-height:1.65;margin-bottom:18px;flex:1}
.proj.feat .proj-desc{color:rgba(255,255,255,0.56);font-size:14.5px;max-width:44ch}
.proj-stack{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;background:var(--paper2);color:var(--dim);border:1px solid var(--rule)}
.proj.feat .pill{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border-color:rgba(255,255,255,0.1)}
.proj-foot{display:flex;align-items:center;gap:14px;margin-top:auto}
.code-link{font-size:12.5px;font-weight:500;color:var(--dim);text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color .2s,gap .2s}
.code-link:hover{color:var(--ink);gap:8px}
.proj.feat .code-link{color:rgba(255,255,255,0.7)}
.proj.feat .code-link:hover{color:#fff}
.demo-link{font-size:12px;font-weight:500;color:var(--signal);background:var(--signal-bg);padding:4px 11px;border-radius:5px;border:1px solid var(--signal-br);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .2s}
.demo-link::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--signal)}
.demo-link:hover{background:rgba(47,111,91,0.14)}
.proj.feat .demo-link{color:#8fd4bb;background:rgba(143,212,187,0.1);border-color:rgba(143,212,187,0.22)}
.proj.feat .demo-link::before{background:#8fd4bb}
.gh-status{margin-top:30px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--subtle);text-align:center;min-height:18px}
.more-head{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);margin:40px 0 16px;padding-top:30px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.more-head::before{content:'';width:18px;height:1px;background:var(--rule2)}

/* ════════ PHOTOS ════════ */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.photo{border-radius:12px;overflow:hidden;background:var(--paper2);border:1px solid var(--rule);position:relative;aspect-ratio:4/3}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s var(--ease2)}
.photo:hover img{transform:scale(1.05)}
.photo .ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--subtle);font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;padding:16px}
.photo .ph-empty .ico{font-size:24px;opacity:0.5}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 12px;background:linear-gradient(transparent,rgba(21,25,30,0.78));color:#fff;font-size:13px;font-weight:400;opacity:0;transition:opacity .3s;pointer-events:none}
.photo:hover .cap{opacity:1}

/* ════════ SKILLS ════════ */
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.skill{padding:26px;border:1px solid var(--rule);border-radius:12px;background:var(--card);transition:border-color .3s,transform .3s var(--ease2)}
.skill:hover{border-color:var(--rule2);transform:translateY(-4px)}
.skill-ico{font-size:20px;margin-bottom:14px;display:block}
.skill-name{font-family:'Fraunces',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:14px;letter-spacing:-0.015em}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px}
.skill-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;background:var(--paper2);color:var(--dim);border:1px solid var(--rule);transition:color .2s,border-color .2s}
.skill:hover .skill-tag{border-color:var(--rule2)}

/* ════════ EXPERIENCE ════════ */
.exp-list{display:flex;flex-direction:column}
.exp{display:grid;grid-template-columns:168px 1fr;gap:44px;padding:40px 0;border-bottom:1px solid var(--rule);position:relative}
.exp:first-child{padding-top:0}
.exp:last-child{border-bottom:none;padding-bottom:0}
.exp-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);padding-top:4px;line-height:1.9}
.exp-now{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--signal);background:var(--signal-bg);border:1px solid var(--signal-br);padding:2px 8px;border-radius:12px;margin-top:8px}
.exp-now::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--signal);animation:beat 2.4s ease-in-out infinite}
.exp-role{font-family:'Fraunces',serif;font-size:19px;font-weight:500;color:var(--ink);margin-bottom:3px;letter-spacing:-0.015em}
.exp-co{font-size:13px;color:var(--dim);margin-bottom:16px}
.exp-ul{list-style:none;margin-bottom:16px}
.exp-ul li{font-size:14px;font-weight:300;color:var(--ink-soft);line-height:1.7;margin-bottom:8px;padding-left:18px;position:relative}
.exp-ul li::before{content:'';position:absolute;left:0;top:11px;width:7px;height:1px;background:var(--signal)}
.exp-tags{display:flex;flex-wrap:wrap;gap:6px}
.exp-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;background:var(--paper2);color:var(--subtle);border:1px solid var(--rule)}

/* ════════ CERTS ════════ */
.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cert{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--card);border:1px solid var(--rule);border-radius:10px;transition:border-color .3s,transform .25s var(--ease)}
.cert:hover{border-color:var(--rule2);transform:translateX(4px)}
.cert-year{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--signal);min-width:32px}
.cert-title{font-size:13.5px;font-weight:500;color:var(--ink);margin-bottom:2px}
.cert-inst{font-size:12px;color:var(--subtle)}

/* ════════ ABOUT ════════ */
.about-grid{display:grid;grid-template-columns:300px 1fr 300px;gap:56px;align-items:start}
.about-photo{border-radius:12px;overflow:hidden;background:var(--paper2);border:1px solid var(--rule);aspect-ratio:3/4;position:relative}
.about-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.about-photo .ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:48px;color:var(--subtle)}
.about-text p{font-size:15.5px;font-weight:300;color:var(--ink-soft);line-height:1.85;margin-bottom:18px}
.about-text p:last-child{margin-bottom:0}
.about-text strong{color:var(--ink);font-weight:500}
.about-side{display:flex;flex-direction:column}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule);gap:16px}
.drow:first-child{padding-top:0}
.drow:last-child{border-bottom:none}
.dkey{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--subtle)}
.dval{font-size:13px;color:var(--ink);text-align:right}
.dval a{color:var(--dim);text-decoration:none;transition:color .2s}
.dval a:hover{color:var(--signal)}
.dval.green{color:var(--signal);display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.dval.green::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--signal)}
.langs{margin-top:30px}
.langs-lab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--subtle);margin-bottom:16px;display:block}
.lang-rows{display:flex;flex-direction:column;gap:13px}
.lrow{display:flex;align-items:center;gap:12px}
.lname{font-size:12.5px;color:var(--dim);min-width:72px}
.ltrack{flex:1;height:2px;background:var(--rule2);border-radius:2px;overflow:hidden}
.lfill{height:100%;background:var(--signal);width:0;transition:width 1.1s var(--ease2)}
.llevel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--subtle);min-width:24px;text-align:right}

/* ════════ CONTACT ════════ */
.contact{background:var(--ink);padding:var(--pad) var(--gutter);text-align:center}
.contact .eyebrow{color:#8fd4bb;justify-content:center}
.contact .eyebrow::before{background:#8fd4bb}
.contact .sec-title{color:#fff}
.contact-sub{font-size:16px;color:rgba(255,255,255,0.5);max-width:48ch;margin:0 auto 52px;line-height:1.7;font-weight:300}
.contact-grid{max-width:760px;margin:0 auto;display:grid;gap:12px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;text-decoration:none;color:inherit;transition:border-color .3s,background .3s,transform .3s var(--ease2)}
.ccard:hover{border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);transform:translateY(-5px)}
.cico{font-size:18px}
.clab{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3)}
.cval{font-size:12px;color:rgba(255,255,255,0.75);word-break:break-all;text-align:center}

/* ════════ FOOTER ════════ */
.foot{background:var(--ink);padding:26px var(--gutter);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center}
.foot p{font-size:11.5px;color:rgba(255,255,255,0.25)}
.foot a{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:rgba(255,255,255,0.3);text-decoration:none;transition:color .2s}
.foot a:hover{color:rgba(255,255,255,0.65)}

/* ════════ SCROLL REVEAL ════════ */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease2),transform .7s var(--ease2)}
.reveal.in{opacity:1;transform:none}

/* ════════ RESPONSIVE ════════ */
@media(max-width:920px){
  :root{--gutter:28px;--pad:76px}
  .skills-grid{grid-template-columns:repeat(2,1fr)}
  .about-grid{grid-template-columns:1fr;gap:40px}
  .about-photo{max-width:300px}
  .photo-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .nav{padding:0 var(--gutter)}
  .nav-links{display:none}
  #hero{padding:96px var(--gutter) 64px}
  .hero-inner{grid-template-columns:1fr;gap:44px}
  .panel{max-width:340px}
  .proj-grid{grid-template-columns:1fr}
  .proj.feat{flex-direction:column}
  .proj.feat .proj-visual{width:100%;min-height:200px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.08)}
  .skills-grid{grid-template-columns:1fr}
  .cert-grid{grid-template-columns:1fr}
  .exp{grid-template-columns:1fr;gap:10px}
  .contact-grid{grid-template-columns:repeat(2,1fr)}
  .photo-grid{grid-template-columns:1fr}
  .foot{flex-direction:column;gap:10px;text-align:center}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .status,.lede,.sub,.ctas,.panel,.reveal,h1.headline .ln span{opacity:1!important;transform:none!important}
}
</style>

<body>
<a href="#projects" class="skip-link">Saltar al contenido</a>
<div id="bar" aria-hidden="true"></div>

<nav class="nav" id="nav" aria-label="Navegación">
  <a href="#" class="brand"><span class="mark"></span><span id="brandName"></span></a>
  <ul class="nav-links" id="navLinks" role="list"></ul>
  <div class="lang" role="group" aria-label="Idioma">
    <button id="b-es" class="active" aria-pressed="true">ES</button>
    <button id="b-en" aria-pressed="false">EN</button>
  </div>
</nav>

<section id="hero" aria-label="Presentación">
  <div class="hero-inner">
    <div id="heroText"></div>
    <div id="heroPanel"></div>
  </div>
</section>

<div id="photosSection"></div>
<div id="projectsSection"></div>
<div id="skillsSection"></div>
<div id="experienceSection"></div>
<div id="certsSection"></div>
<div id="aboutSection"></div>
<div id="contactSection"></div>
<footer class="foot" id="footer"></footer>

<script>
'use strict';

/* ────── UI STRINGS ────── */
const UI = {
  es:{
    nav:{projects:'Proyectos',photos:'Momentos',skills:'Skills',experience:'Experiencia',about:'Sobre mí',contact:'Contacto'},
    hero:{projects:'Ver proyectos'},
    photos:{eyebrow:'Momentos',title:'En el trabajo',sub:'Charlas, equipos y eventos a lo largo del camino.'},
    projects:{eyebrow:'Portafolio',title:'Proyectos',sub:'Código abierto, modelos en producción y demos en vivo. Sincronizado con GitHub.',more:'Más en GitHub',code:'Ver código',loading:'Cargando desde GitHub…',error:'No se pudo conectar con GitHub. Mostrando proyectos curados.',demo:'Demo'},
    skills:{eyebrow:'Stack',title:'Herramientas',sub:'Con lo que construyo sistemas de IA y datos.'},
    exp:{eyebrow:'Trayectoria',title:'Experiencia',sub:'Dónde apliqué IA y ciencia de datos para resolver problemas reales.',current:'Actual'},
    certs:{eyebrow:'Formación',title:'Certificaciones'},
    about:{eyebrow:'Sobre mí',title:'Quién soy',langs:'Idiomas'},
    contact:{eyebrow:'Contacto',title:'Hablemos',sub:'Abierto a oportunidades full-time, consultoría y colaboraciones en IA y datos.'},
    side:{location:'Ubicación',availability:'Disponibilidad',available:'Disponible',mode:'Modalidad',education:'Educación',phone:'Teléfono'},
  },
  en:{
    nav:{projects:'Projects',photos:'Moments',skills:'Skills',experience:'Experience',about:'About',contact:'Contact'},
    hero:{projects:'See projects'},
    photos:{eyebrow:'Moments',title:'At work',sub:'Talks, teams and events along the way.'},
    projects:{eyebrow:'Portfolio',title:'Projects',sub:'Open-source code, production models and live demos. Synced with GitHub.',more:'More on GitHub',code:'View code',loading:'Loading from GitHub…',error:'Could not connect to GitHub. Showing curated projects.',demo:'Demo'},
    skills:{eyebrow:'Stack',title:'Tooling',sub:'What I use to build AI and data systems.'},
    exp:{eyebrow:'Career',title:'Experience',sub:'Where I applied AI and data science to real problems.',current:'Current'},
    certs:{eyebrow:'Education',title:'Certifications'},
    about:{eyebrow:'About',title:'Who I am',langs:'Languages'},
    contact:{eyebrow:'Contact',title:"Let's talk",sub:'Open to full-time roles, consulting and AI & data collaborations.'},
    side:{location:'Location',availability:'Availability',available:'Available',mode:'Mode',education:'Education',phone:'Phone'},
  }
};

let lang='es';
function t(p){return p.split('.').reduce((o,k)=>(o&&o[k]!==undefined?o[k]:''),UI[lang]);}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}

/* ────── progress + nav shadow ────── */
const bar=document.getElementById('bar'),navEl=document.getElementById('nav');
window.addEventListener('scroll',()=>{
  const max=document.body.scrollHeight-window.innerHeight;
  bar.style.width=(max>0?(window.scrollY/max)*100:0)+'%';
  navEl.classList.toggle('scrolled',window.scrollY>20);
},{passive:true});

/* ────── reveal ────── */
const revObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');revObs.unobserve(e.target);}});},{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
function observe(root=document){root.querySelectorAll('.reveal').forEach(e=>revObs.observe(e));}
function stagger(grid){grid.querySelectorAll('.reveal').forEach((e,i)=>{e.style.transitionDelay=(i*0.08)+'s';});}

/* ────── counters ────── */
const cntObs=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const node=e.target,target=+node.dataset.target,suf=node.dataset.suffix||'';let cur=0;const steps=48,inc=target/steps;const tm=setInterval(()=>{cur=Math.min(cur+inc,target);node.firstChild.textContent=Math.round(cur);if(cur>=target)clearInterval(tm);},900/steps);cntObs.unobserve(node);});},{threshold:0.6});

/* ────── lang bars ────── */
const barObs=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;e.target.querySelectorAll('.lfill').forEach(b=>{setTimeout(()=>{b.style.width=b.dataset.w+'%';},150);});barObs.unobserve(e.target);});},{threshold:0.3});

/* ────── NAV ────── */
function renderNav(){
  document.getElementById('brandName').textContent=GITHUB_USER;
  const items=[['#projects',t('nav.projects')]];
  if(PHOTOS.filter(p=>p.src).length||PHOTOS.length)items.push(['#photos',t('nav.photos')]);
  items.push(['#skills',t('nav.skills')],['#experience',t('nav.experience')],['#about',t('nav.about')],['#contact',t('nav.contact')]);
  const filtered=items.filter(([h])=>SHOW[h.slice(1)]!==false||h==='#photos');
  document.getElementById('navLinks').innerHTML=filtered.map(([h,l])=>`<li><a href="${h}">${l}</a></li>`).join('');
}

/* ────── HERO ────── */
function renderHero(){
  const hl=lang==='en'?PROFILE.headline_en:PROFILE.headline_es;
  const lede=lang==='en'?PROFILE.lede_en:PROFILE.lede_es;
  const sub=lang==='en'?PROFILE.sub_en:PROFILE.sub_es;
  const avail=lang==='en'?PROFILE.available_en:PROFILE.available_es;
  const L=PROFILE.links;
  const ctas=[
    `<a href="#projects" class="btn btn-main">${t('hero.projects')}</a>`,
    L.linkedin?`<a href="${L.linkedin}" target="_blank" rel="noopener" class="btn btn-ghost">LinkedIn ↗</a>`:'',
    L.github?`<a href="${L.github}" target="_blank" rel="noopener" class="btn btn-ghost">GitHub ↗</a>`:'',
    L.cv?`<a href="${L.cv}" target="_blank" rel="noopener" class="btn btn-ghost">CV ↗</a>`:'',
  ].filter(Boolean).join('');
  document.getElementById('heroText').innerHTML=`
    <div class="status"><span class="live"></span>${avail}</div>
    <h1 class="headline">
      <span class="ln"><span>${hl[0]}</span></span>
      <span class="ln"><span>${hl[1]}</span></span>
      <span class="ln"><span class="accent">${hl[2]}</span></span>
    </h1>
    <p class="lede">${lede}</p>
    <p class="sub">${sub}</p>
    <div class="ctas">${ctas}</div>`;

  const readings=STATS.map(s=>`
    <div class="reading">
      <div class="val"><span data-target="${s.target}" data-suffix="${s.suffix}">0</span>${s.suffix?`<span class="u">${s.suffix}</span>`:''}${s.unit?`<span class="u">${s.unit}</span>`:''}</div>
      <div class="lab">${lang==='en'?s.label_en:s.label_es}</div>
    </div>`).join('');
  document.getElementById('heroPanel').innerHTML=`
    <aside class="panel" aria-label="Métricas">
      <div class="panel-head"><span>estado · live</span><span class="pdot"></span></div>
      ${readings}
    </aside>`;
  if(SHOW.stats)document.querySelectorAll('.reading [data-target]').forEach(e=>cntObs.observe(e));
}

/* ────── PHOTOS ────── */
function renderPhotos(){
  const tgt=document.getElementById('photosSection');
  if(!PHOTOS.length){tgt.remove();return;}
  const cards=PHOTOS.map(p=>{
    const cap=lang==='en'?p.caption_en:p.caption_es;
    const inner=p.src
      ? `<img src="${p.src}" alt="${cap||''}"/><div class="cap">${cap||''}</div>`
      : `<div class="ph-empty"><span class="ico">⊹</span>${cap||'Foto'}</div>`;
    return `<div class="photo reveal">${inner}</div>`;
  }).join('');
  tgt.className='alt';
  tgt.innerHTML=`
    <div class="sep"></div>
    <div id="photos"><div class="container"><div class="section">
      <div class="eyebrow reveal">${t('photos.eyebrow')}</div>
      <h2 class="sec-title reveal">${t('photos.title')}</h2>
      <p class="sec-sub reveal">${t('photos.sub')}</p>
      <div class="photo-grid">${cards}</div>
    </div></div></div>`;
  stagger(tgt.querySelector('.photo-grid'));observe(tgt);
}

/* ────── PROJECTS ────── */
function fmt(s){return(s||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function card(meta,feat){
  const c=el('div','proj reveal'+(feat?' feat':''));
  c.setAttribute('role','listitem');c.setAttribute('tabindex','0');
  const title=(lang==='en'?meta.title_en:meta.title_es)||fmt(meta.repo||meta.name);
  const desc=(lang==='en'?meta.desc_en:meta.desc_es)||meta.ghDesc||'';
  const tags=(meta.tags&&meta.tags.length)?meta.tags:(meta.topics||[]);
  const tagline=feat?'★ Destacado':(tags.slice(0,2).join(' · ')||meta.language||'');
  const metricHtml=meta.metric?`<div class="metric">${meta.metric}</div>`:'';
  const stack=tags.length?`<div class="proj-stack">${tags.map(x=>`<span class="pill">${x}</span>`).join('')}</div>`:'';
  const demo=meta.demo?`<a href="${meta.demo}" target="_blank" rel="noopener" class="demo-link">${t('projects.demo')}</a>`:'';
  const visual=meta.image?`<div class="proj-visual"><img src="${meta.image}" alt="${title}" loading="lazy"/></div>`:'';
  const body=`<div class="proj-body">
      <div class="tagline"><span class="fdot"></span>${tagline}</div>
      ${metricHtml}
      <h3 class="proj-title">${title}</h3>
      <p class="proj-desc">${desc}</p>
      ${stack}
      <div class="proj-foot"><a href="${meta.url}" target="_blank" rel="noopener" class="code-link">${t('projects.code')} →</a>${demo}</div>
    </div>`;
  c.innerHTML=feat?(visual+body):(visual+body);
  c.addEventListener('click',e=>{if(e.target.closest('a'))return;window.open(meta.url,'_blank','noopener');});
  c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();window.open(meta.url,'_blank','noopener');}});
  return c;
}
function renderProjShell(){
  const tgt=document.getElementById('projectsSection');
  if(!SHOW.projects){tgt.remove();return;}
  tgt.innerHTML=`
    <div class="sep"></div>
    <div id="projects"><div class="container"><div class="section">
      <div class="eyebrow reveal">${t('projects.eyebrow')}</div>
      <h2 class="sec-title reveal">${t('projects.title')}</h2>
      <p class="sec-sub reveal">${t('projects.sub')}</p>
      <div class="proj-grid" id="pinnedGrid" role="list"></div>
      <p class="more-head reveal" id="moreHead" style="display:none">${t('projects.more')}</p>
      <div class="proj-grid" id="extraGrid" role="list"></div>
      <p class="gh-status" id="ghStatus" aria-live="polite"></p>
    </div></div></div>`;
  observe(tgt);
}
function renderPinned(){
  const grid=document.getElementById('pinnedGrid');if(!grid)return;grid.innerHTML='';
  Object.entries(PROJECT_META).filter(([,m])=>!m.hidden&&m.pinOrder).sort(([,a],[,b])=>(a.pinOrder||99)-(b.pinOrder||99))
    .forEach(([repo,meta])=>{const m={...meta,repo,name:repo,url:`https://github.com/${GITHUB_USER}/${repo}`};grid.appendChild(card(m,!!meta.featured));});
  stagger(grid);observe(grid);
}
async function loadExtra(){
  const extra=document.getElementById('extraGrid'),head=document.getElementById('moreHead'),status=document.getElementById('ghStatus');
  if(!extra)return;status.textContent=t('projects.loading');
  try{
    const res=await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated`,{headers:{Accept:'application/vnd.github.v3+json'}});
    if(!res.ok)throw new Error();
    const repos=await res.json();
    const pinned=new Set(Object.entries(PROJECT_META).filter(([,m])=>m.pinOrder).map(([k])=>k.toLowerCase()));
    const extras=repos.filter(r=>!r.fork&&!pinned.has(r.name.toLowerCase())&&!PROJECT_META[r.name]?.hidden).slice(0,6);
    extra.innerHTML='';
    if(extras.length){head.style.display='';extras.forEach(r=>{const ov=PROJECT_META[r.name]||{};const m={repo:r.name,name:r.name,url:r.html_url,ghDesc:r.description,language:r.language,topics:r.topics||[],...ov};extra.appendChild(card(m,false));});stagger(extra);observe(extra);}
    const date=new Date().toLocaleDateString(lang==='en'?'en-US':'es-CO');
    status.textContent=`↻ ${lang==='en'?'Synced from GitHub':'Sincronizado'} · ${repos.length} repos · ${date}`;
  }catch{status.textContent=t('projects.error');}
}

/* ────── SKILLS ────── */
function renderSkills(){
  const tgt=document.getElementById('skillsSection');if(!SHOW.skills){tgt.remove();return;}
  const cards=SKILLS.map(s=>`<div class="skill reveal"><span class="skill-ico" aria-hidden="true">${s.icon}</span><h3 class="skill-name">${s.name}</h3><div class="skill-tags">${s.tags.map(x=>`<span class="skill-tag">${x}</span>`).join('')}</div></div>`).join('');
  tgt.className='alt';
  tgt.innerHTML=`<div class="sep"></div><div id="skills"><div class="container"><div class="section">
    <div class="eyebrow reveal">${t('skills.eyebrow')}</div><h2 class="sec-title reveal">${t('skills.title')}</h2><p class="sec-sub reveal">${t('skills.sub')}</p>
    <div class="skills-grid">${cards}</div></div></div></div>`;
  stagger(tgt.querySelector('.skills-grid'));observe(tgt);
}

/* ────── EXPERIENCE ────── */
function renderExp(){
  const tgt=document.getElementById('experienceSection');if(!SHOW.experience){tgt.remove();return;}
  const items=EXPERIENCE.map(x=>{
    const role=lang==='en'?x.role_en:x.role_es,per=lang==='en'?x.period_en:x.period_es,bl=lang==='en'?x.bullets_en:x.bullets_es;
    const now=x.current?`<div class="exp-now">${t('exp.current')}</div>`:'';
    return `<article class="exp reveal"><div class="exp-meta">${per}${now}</div><div><h3 class="exp-role">${role}</h3><p class="exp-co">${x.company}</p><ul class="exp-ul">${bl.map(b=>`<li>${b}</li>`).join('')}</ul><div class="exp-tags">${x.tags.map(tg=>`<span class="exp-tag">${tg}</span>`).join('')}</div></div></article>`;
  }).join('');
  tgt.innerHTML=`<div class="sep"></div><div id="experience"><div class="container"><div class="section">
    <div class="eyebrow reveal">${t('exp.eyebrow')}</div><h2 class="sec-title reveal">${t('exp.title')}</h2><p class="sec-sub reveal">${t('exp.sub')}</p>
    <div class="exp-list">${items}</div></div></div></div>`;
  observe(tgt);
}

/* ────── CERTS ────── */
function renderCerts(){
  const tgt=document.getElementById('certsSection');if(!SHOW.certifications){tgt.remove();return;}
  const cards=CERTIFICATIONS.map(c=>{const title=lang==='en'?(c.title_en||c.title_es):c.title_es;return `<div class="cert reveal"><span class="cert-year">${c.year}</span><div><div class="cert-title">${title}</div><div class="cert-inst">${c.institution}</div></div></div>`;}).join('');
  tgt.className='alt';
  tgt.innerHTML=`<div class="sep"></div><div id="certs"><div class="container"><div class="section">
    <div class="eyebrow reveal">${t('certs.eyebrow')}</div><h2 class="sec-title reveal">${t('certs.title')}</h2>
    <div class="cert-grid">${cards}</div></div></div></div>`;
  stagger(tgt.querySelector('.cert-grid'));observe(tgt);
}

/* ────── ABOUT ────── */
function renderAbout(){
  const tgt=document.getElementById('aboutSection');if(!SHOW.about){tgt.remove();return;}
  const paras=ABOUT_PARAGRAPHS.map(p=>`<p>${lang==='en'?p.en:p.es}</p>`).join('');
  const photo=PROFILE.photo&&PROFILE.photo.trim()
    ? `<div class="about-photo"><img src="${PROFILE.photo}" alt="${PROFILE.name_full}"/></div>`
    : `<div class="about-photo"><div class="ph-empty">${PROFILE.initials}</div></div>`;
  const langBars=SHOW.languages?`<div class="langs"><span class="langs-lab">${t('about.langs')}</span><div class="lang-rows">${LANGUAGES.map(l=>`<div class="lrow"><span class="lname">${l.name}</span><div class="ltrack"><div class="lfill" data-w="${l.pct}"></div></div><span class="llevel">${l.level}</span></div>`).join('')}</div></div>`:'';
  const L=PROFILE.links;
  const rows=[
    {k:t('side.location'),v:PROFILE.location_full},
    {k:t('side.availability'),v:PROFILE.is_available?`<span class="green">${t('side.available')}</span>`:(lang==='en'?'Not available':'No disponible')},
    {k:t('side.mode'),v:lang==='en'?PROFILE.work_mode_en:PROFILE.work_mode_es},
    {k:t('side.education'),v:lang==='en'?PROFILE.education_en:PROFILE.education_es},
    L.github?{k:'GitHub',v:`<a href="${L.github}" target="_blank" rel="noopener">${GITHUB_USER} ↗</a>`}:null,
    L.linkedin?{k:'LinkedIn',v:`<a href="${L.linkedin}" target="_blank" rel="noopener">${PROFILE.name_full.split(' ').slice(0,2).join(' ')} ↗</a>`}:null,
    L.email?{k:'Email',v:`<a href="mailto:${L.email}">${L.email}</a>`}:null,
    L.phone?{k:t('side.phone'),v:`<a href="tel:${L.phone}">${L.phone_display}</a>`}:null,
  ].filter(Boolean);
  const side=rows.map(r=>`<div class="drow"><span class="dkey">${r.k}</span><span class="dval">${r.v}</span></div>`).join('');
  tgt.innerHTML=`<div class="sep"></div><div id="about"><div class="container"><div class="section">
    <div class="eyebrow reveal">${t('about.eyebrow')}</div><h2 class="sec-title reveal">${t('about.title')}</h2>
    <div class="about-grid"><div class="reveal">${photo}</div><div class="about-text reveal">${paras}</div><div class="about-side reveal">${side}${langBars}</div></div>
  </div></div></div>`;
  if(SHOW.languages)barObs.observe(tgt.querySelector('.lang-rows'));
  observe(tgt);
}

/* ────── CONTACT ────── */
function renderContact(){
  const tgt=document.getElementById('contactSection');if(!SHOW.contact){tgt.remove();return;}
  const L=PROFILE.links;
  const cards=[
    L.email?{href:`mailto:${L.email}`,ico:'✉',lab:'Email',v:L.email}:null,
    L.github?{href:L.github,ico:'⌥',lab:'GitHub',v:GITHUB_USER,ext:true}:null,
    L.linkedin?{href:L.linkedin,ico:'in',lab:'LinkedIn',v:PROFILE.name_full.split(' ').slice(0,2).join(' '),ext:true}:null,
    L.phone?{href:`tel:${L.phone}`,ico:'☏',lab:'WhatsApp',v:L.phone_display}:null,
    L.cv?{href:L.cv,ico:'▤',lab:'CV',v:lang==='en'?'Download ↗':'Descargar ↗',ext:true}:null,
  ].filter(Boolean);
  const cols=Math.min(cards.length,4);
  const html=cards.map(c=>`<a href="${c.href}"${c.ext?' target="_blank" rel="noopener"':''} class="ccard"><span class="cico" aria-hidden="true">${c.ico}</span><span class="clab">${c.lab}</span><span class="cval">${c.v}</span></a>`).join('');
  tgt.innerHTML=`<div id="contact"><section class="contact">
    <div class="eyebrow">${t('contact.eyebrow')}</div><h2 class="sec-title">${t('contact.title')}</h2><p class="contact-sub">${t('contact.sub')}</p>
    <div class="contact-grid" style="grid-template-columns:repeat(${cols},1fr)">${html}</div></section></div>`;
}

/* ────── FOOTER ────── */
function renderFooter(){
  document.getElementById('footer').innerHTML=`<p>© ${PROFILE.year} ${PROFILE.name_full}</p>${PROFILE.links.github?`<a href="${PROFILE.links.github}" target="_blank" rel="noopener">${PROFILE.links.github.replace('https://','')} ↗</a>`:''}`;
}

/* ────── ORCHESTRATOR ────── */
function renderAll(){
  document.getElementById('pageTitle').textContent=`${PROFILE.name_line1} ${PROFILE.name_line2} · AI Engineer`;
  document.getElementById('metaDesc').content=`${PROFILE.name_full} — AI Engineer, Data Scientist & Economist. Agentes de IA, gobernanza y ciencia de datos.`;
  renderNav();renderHero();renderPhotos();renderProjShell();renderSkills();renderExp();renderCerts();renderAbout();renderContact();renderFooter();
  observe();
}
function refresh(){renderNav();renderHero();renderPhotos();renderProjShell();renderSkills();renderExp();renderCerts();renderAbout();renderContact();renderFooter();observe();renderPinned();loadExtra();}

/* ────── LANG ────── */
function applyLang(l){
  lang=l;document.documentElement.lang=l;
  document.getElementById('b-es').classList.toggle('active',l==='es');
  document.getElementById('b-en').classList.toggle('active',l==='en');
  document.getElementById('b-es').setAttribute('aria-pressed',l==='es');
  document.getElementById('b-en').setAttribute('aria-pressed',l==='en');
  refresh();
}
document.getElementById('b-es').addEventListener('click',()=>applyLang('es'));
document.getElementById('b-en').addEventListener('click',()=>applyLang('en'));

/* ────── INIT ────── */
lang=(navigator.language||'es').toLowerCase().startsWith('es')?'es':'en';
document.getElementById('b-'+lang).classList.add('active');
renderAll();renderPinned();loadExtra();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('loaded')));
</script>
</body>
